<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pipeline · BS²</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: kanban board of 5 stages across the top; clicking a card opens a lead record panel below with tabs. BS2 dark brand, single theme by choice. */
  :root {
    color-scheme: dark;
    --bg: #0c0f14;
    --surface: #11151c;
    --surface-2: #171c25;
    --line: #232a35;
    --line-2: #3a4352;
    --text: #e8ecf2;
    --muted: #a7b0bf;
    --faint: #8a94a5;
    --accent: #7ee0c3;
    --on-accent: #0c0f14;
    --warn: #f2c66d;
    --info: #8fb8ff;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--display); font-size: 15px; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, p { margin: 0; }
  .page { max-width: 1320px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  .logo { font-weight: 700; font-size: 22px; }
  .logo sup { font-size: 13px; color: var(--accent); }
  .logo span { font-family: var(--mono); font-weight: 400; font-size: 14px; color: var(--accent); margin-left: 10px; }
  .banner { font-family: var(--mono); font-size: 12px; color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 4px 10px; }
  .mono { font-family: var(--mono); }
  .btn { font: inherit; font-size: 14px; font-weight: 500; border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line-2); background: transparent; color: var(--text); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn.solid:hover { filter: brightness(1.08); color: var(--on-accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Board */
  .boardwrap { overflow-x: auto; padding-bottom: 6px; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; min-width: 1150px; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; }
  .colhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .colhead h3 { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); }
  .colhead .n { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .colhint { font-size: 12px; color: var(--faint); line-height: 1.4; }
  .card { text-align: left; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .card:hover { border-color: var(--line-2); }
  .card.sel { border-color: var(--accent); }
  .card b { font-weight: 500; font-size: 15px; }
  .card small { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); }
  .chip.ok { border-color: var(--accent); color: var(--accent); }
  .chip.wait { border-color: var(--warn); color: var(--warn); }

  /* Record */
  .record { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
  .rhead { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-start; }
  .rhead h2 { font-size: 28px; letter-spacing: -.5px; }
  .rhead p { color: var(--muted); margin-top: 4px; }
  .stepper { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { font-family: var(--mono); font-size: 12px; padding: 5px 10px; border-radius: 6px; background: var(--surface-2); color: var(--faint); }
  .step.done { color: var(--accent); }
  .step.now { background: var(--accent); color: var(--on-accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab { font: inherit; font-family: var(--mono); font-size: 13px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .lock { color: var(--faint); font-size: 11px; margin-left: 4px; }
  .pane { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); border-top: 1px solid var(--line); }
  .kv div { padding: 9px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
  .kv div:nth-child(odd) { color: var(--faint); font-size: 13px; padding-right: 12px; }
  @media (max-width: 600px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv div:nth-child(odd) { border-bottom: 0; padding-bottom: 0; } }
  .src { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .empty { color: var(--faint); font-size: 14px; border: 1px dashed var(--line-2); border-radius: 10px; padding: 18px; line-height: 1.5; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 2px; flex: none; }
  .check.donecheck span { color: var(--faint); text-decoration: line-through; }
  .q { display: flex; flex-direction: column; gap: 6px; }
  .q label { font-size: 13px; color: var(--muted); }
  textarea, input[type=text] { font: inherit; font-size: 14px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  .grp { font-size: 15px; font-weight: 500; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .star { color: var(--accent); }
  .qnote { font-size: 12px; color: var(--faint); line-height: 1.5; border-left: 2px solid var(--line-2); padding-left: 10px; margin: 0; }
  select, input[type=date], input[type=datetime-local] { font: inherit; font-size: 14px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; width: 100%; color-scheme: dark; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 11px; cursor: pointer; color: var(--muted); }
  .opt:has(input:checked) { border-color: var(--accent); color: var(--text); }
  .opt input { accent-color: var(--accent); margin: 0; }
  .wide { grid-column: 1 / -1; }
  .stagebox { border: 1px solid var(--line-2); border-radius: 10px; padding: 14px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .line { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .line span:first-child { color: var(--muted); }
  .line span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .line.total { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--line-2); }
  .line.total span:first-child { color: var(--text); }
  .msg { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .msg .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .msg p { color: var(--muted); line-height: 1.5; }
  .portal { border: 1px solid var(--accent); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .portal h4 { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toast { font-size: 13px; color: var(--accent); min-height: 1.2em; }
  .note { font-size: 13px; color: var(--faint); line-height: 1.5; }
  [hidden] { display: none !important; }
  .embed .page { padding: 16px 0 24px; max-width: none; }
  .embed .top { border-bottom: 0; padding-bottom: 0; }
  .embed .logo, .embed #who, .embed .top a.btn { display: none; }
</style>
</head>
<body>
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed");</script>
<div class="page">
  <div class="top">
    <p class="logo">BS<sup>2</sup><span>pipeline()</span></p>
    <div class="row">
      <span class="note mono" id="who"></span>
      <button class="btn" id="copyIntake" type="button" hidden title="Copy your intake form link to send to someone">Copy intake form link</button>
      <button class="btn solid" id="addBtn" type="button" hidden>+ Add lead</button>
      <a class="btn" href="portal.html">/portal</a>
    </div>
  </div>

  <p class="empty" id="gate">Loading…</p>

  <form class="record" id="addForm" hidden>
    <h2 style="font-size:22px" id="addTitle">Add a lead</h2>
    <p class="note" id="addNote">Same questions as your intake form, so every lead looks the same. Only name and email are required.</p>
    <div class="two">
      <div class="q"><label for="nName">Name</label><input type="text" id="nName" required></div>
      <div class="q"><label for="nEmail">Email</label><input type="text" id="nEmail" required inputmode="email"></div>
      <div class="q wide"><label for="nBiz">Business name and website or social link</label><input type="text" id="nBiz"></div>
    </div>
    <div class="two" id="intakeFields"></div>
    <div class="stagebox" id="stageBox">
      <div class="q" style="flex:1;min-width:220px"><label for="nStage">Where are things at?</label>
        <select id="nStage"><option value="lead">New lead, no call yet</option><option value="call">We already had the 30-min call</option></select></div>
      <div class="q" id="nCallWrap" hidden><label for="nCall">Call date</label><input type="date" id="nCall"></div>
    </div>
    <div class="row"><button class="btn solid" type="submit" id="addSubmit">Add lead</button><button class="btn" type="button" id="cancelAdd">Cancel</button></div>
  </form>

  <div class="boardwrap" id="boardwrap" hidden><div class="board" id="board"></div></div>
  <section class="record" id="record" aria-live="polite" hidden></section>
  <p class="toast" id="toast" role="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://wwznpjdpbewyhswotuht.supabase.co";
const SUPABASE_KEY = "sb_publishable_wAGaa2nu8tAha93pdvookQ_k4wsFIkx";
if (!window.supabase) { document.getElementById("gate").textContent = "Couldn't load the sign-in library. Check your connection and refresh."; throw new Error("supabase-js not loaded"); }
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STAGES = [
  { id: "lead",      name: "new lead",    hint: "Intake form or booking came in." },
  { id: "call",      name: "30-min call", hint: "Call booked. Onboarding starts here." },
  { id: "quote",     name: "quote",       hint: "Quote sent, waiting on a yes." },
  { id: "agreement", name: "agreement",   hint: "Quote accepted, agreement out to sign." },
  { id: "client",    name: "client",      hint: "Signed. Portal account created." },
];
// Call questions, grouped. ★ = ask first if time runs short. Keep the ids: answers are saved under them.
const ONBOARD = [
  { h: "The business", qs: [
    { id: "0", star: true, q: "What does a normal week look like, and where does the admin pile up?" },
    { id: "b1", star: true, q: "How many customers or jobs a month now, and where do you want to be in a year?" },
    { id: "b2", q: "Who does the admin today: you, a partner, a bookkeeper? How many hours a week?" },
    { id: "b3", q: "What does a typical job or sale look like, and its price range?" },
  ] },
  { h: "How work flows", qs: [
    { id: "1", star: true, q: "Walk me through how a job goes from first contact to getting paid." },
    { id: "f1", q: "How do customers find you and book: phone, email, website, social, referrals?" },
    { id: "f2", star: true, q: "How do you build quotes today, and how many turn into jobs?" },
    { id: "f3", q: "Where do things fall through the cracks: follow-ups, scheduling, chasing payments?" },
  ] },
  { h: "Invoices and money", qs: [
    { id: "m1", star: true, q: "Are you registered for HST?" },
    { id: "m2", star: true, q: "How do your customers usually pay (card, debit, bank transfer, cheque)? Roughly what share by card?",
      note: "Card fee strategy: quote one price, and offer 2 to 3% off for bank transfer or debit on big invoices. A card surcharge up to 2.4% is allowed on Visa and Mastercard, but needs 30 days' notice to Visa, Mastercard and Stripe, and isn't allowed on debit or in Quebec. For monthly plans, absorb the fee and make bank debit the default." },
    { id: "m3", q: "How many invoices do you send a month? Deposits? Payment terms? How often are people late?" },
    { id: "m4", q: "How many bills come in a month (suppliers, subscriptions), and how do they arrive?" },
    { id: "m5", q: "Do you have an accountant or bookkeeper? What software do they want (QuickBooks, Xero)?" },
    { id: "m6", q: "Which bank do you use?" },
  ] },
  { h: "Tools and accounts", qs: [
    { id: "2", star: true, q: "Which tools and accounts do you use today, and who has the logins?" },
    { id: "t1", q: "Do you have a domain, website and business email? Who controls them?" },
    { id: "t2", q: "Anything you pay for but don't use, or love and want to keep?" },
    { id: "t3", q: "Any customer data you keep (lists, photos, files)? Where does it live?" },
  ] },
  { h: "Goals and next steps", qs: [
    { id: "4", star: true, q: "What would make this a win in 3 months?" },
    { id: "g1", q: "If one thing were automated tomorrow, what would it be?" },
    { id: "3", star: true, q: "Who makes the final decision on this project?" },
    { id: "g2", q: "Budget and timing: does the range from the intake still hold, and when would you start?" },
  ] },
];
const ONBOARD_TASKS = ["Send the call summary email", "Get access to their current tools", "Confirm budget and timeline", "Build the quote in the quote builder", "Ask them to send 1 or 2 past quotes or invoices, their logo and HST number"];
// Same questions and labels as intake.html (and the old Tally form), so every lead matches.
const INTAKE = [
  { k: "What does your business do, in one line?", t: "text" },
  { k: "Industry", t: "one", o: ["Restaurant / hospitality", "Retail", "Trades / construction", "Health & wellness", "Professional services", "Other"] },
  { k: "Team size", t: "one", o: ["Just me", "2–5", "6–20", "20+"] },
  { k: "What can I help with?", t: "many", o: ["New website", "Bookings / scheduling", "Quotes, invoicing & payments", "CRM / sales pipeline", "Data & dashboards", "AI / automation", "Not sure yet"] },
  { k: "What's the biggest time-waster in your week right now?", t: "area" },
  { k: "What tools do you use today?", t: "many", o: ["Google Workspace", "Microsoft 365", "Square / Shopify / Clover", "QuickBooks / Wave", "Spreadsheets", "Pen and paper", "Other"] },
  { k: "What's your yearly budget for tech, including setup and ongoing support? (CAD)", t: "one", o: ["Under $2k", "$2k–5k", "$5k–10k", "$10k+", "Not sure yet"] },
  { k: "Timeline", t: "one", o: ["ASAP", "1–3 months", "Just exploring"] },
  { k: "Preferred language for our call", t: "one", o: ["English", "Français", "Español"] },
  { k: "Anything else I should know before we talk?", t: "area" },
  { k: "How they found you", t: "text", ph: "e.g. Referral from Sam" },
];
let editing = null;
function intakeFields(vals) {
  const has = (v, x) => (", " + (v || "") + ", ").includes(", " + x + ", ");
  return INTAKE.map((f, i) => {
    const v = vals[f.k] || "", id = "in" + i, lab = `<label for="${id}">${esc(f.k)}</label>`;
    if (f.t === "text") return `<div class="q">${lab}<input type="text" id="${id}" value="${esc(v)}" placeholder="${esc(f.ph || "")}"></div>`;
    if (f.t === "area") return `<div class="q wide">${lab}<textarea id="${id}">${esc(v)}</textarea></div>`;
    if (f.t === "one") return `<div class="q">${lab}<select id="${id}"><option value="">Pick one</option>${f.o.map(x => `<option ${v === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>`;
    return `<div class="q wide"><span class="note">${esc(f.k)}</span><div class="opts" id="${id}">${f.o.map(x => `<label class="opt"><input type="checkbox" value="${esc(x)}" ${has(v, x) ? "checked" : ""}>${esc(x)}</label>`).join("")}</div></div>`;
  }).join("");
}
function readIntake(prev) {
  const out = { ...prev };
  INTAKE.forEach((f, i) => {
    const el = $("in" + i);
    const v = f.t === "many" ? [...el.querySelectorAll("input:checked")].map(x => x.value).join(", ") : el.value.trim();
    if (v) out[f.k] = v; else delete out[f.k];
  });
  return out;
}
function openLeadForm(l) {
  editing = l || null;
  $("addTitle").textContent = l ? "Edit intake answers" : "Add a lead";
  $("addSubmit").textContent = l ? "Save answers" : "Add lead";
  $("stageBox").hidden = !!l;
  $("nName").value = l?.name || ""; $("nEmail").value = l?.email || ""; $("nBiz").value = l?.business || "";
  $("intakeFields").innerHTML = intakeFields(l?.intake || {});
  $("nStage").value = "lead"; $("nCallWrap").hidden = true; $("nCall").value = new Date().toLocaleDateString("en-CA");
  $("addForm").hidden = false; $("addForm").scrollIntoView({ behavior: "smooth", block: "start" }); $("nName").focus();
}
const TABS = [
  { id: "intake", name: "intake", from: 0 }, { id: "onboard", name: "onboarding", from: 1 },
  { id: "quote", name: "quote", from: 1 }, { id: "agreement", name: "agreement", from: 3 },
  { id: "messages", name: "messages", from: 0 }, { id: "portal", name: "portal", from: 4 },
];
const PLANS = { Care: 100, Plus: 200, Pro: 300 };
// What a saved quote means each month. Older quotes have no maint/planfee, so fall back to the plan price and 10%.
function qMoney(q) {
  const maint = q.maint != null ? +q.maint : PLANS[q.plan || "Plus"] || 0;
  const fee = q.planfee != null ? +q.planfee : 10;
  return { maint, fee, spread: q.spread ? (+q.setup || 0) * (1 + fee / 100) / 12 : 0 };
}

let LEADS = [], EVENTS = {}, sel = null, tab = "intake";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const money = n => "$" + (+n || 0).toLocaleString("en-CA", { maximumFractionDigits: 2 });
const idx = s => STAGES.findIndex(x => x.id === s);
const lead = () => LEADS.find(l => l.id === sel);
const when = t => new Date(t).toLocaleString("en-CA", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function toast(t, bad) { const el = $("toast"); el.textContent = t; el.style.color = bad ? "var(--warn)" : ""; setTimeout(() => { if (el.textContent === t) el.textContent = ""; }, 4000); }

async function save(l, fields) {
  Object.assign(l, fields);
  const { error } = await sb.from("leads").update({ ...fields, updated_at: new Date().toISOString() }).eq("id", l.id);
  if (error) toast("Couldn't save: " + error.message, true);
}
async function logEvent(l, who, text) {
  const { data, error } = await sb.from("lead_events").insert({ lead_id: l.id, who, text }).select().single();
  if (error) { toast("Couldn't log that: " + error.message, true); return; }
  (EVENTS[l.id] ||= []).push(data);
}

async function load() {
  const [{ data: leads, error }, { data: events }] = await Promise.all([
    sb.from("leads").select("*").neq("stage", "lost").order("created_at", { ascending: false }),
    sb.from("lead_events").select("*").order("created_at"),
  ]);
  if (error) { $("gate").textContent = "Couldn't load the pipeline: " + error.message; return; }
  LEADS = leads; EVENTS = {};
  (events || []).forEach(e => (EVENTS[e.lead_id] ||= []).push(e));
  const want = new URLSearchParams(location.search).get("lead");
  if (want && LEADS.some(x => x.id === want) && !sel) { sel = want; tab = "quote"; }
  if (!sel && LEADS.length) sel = LEADS[0].id;
  $("gate").hidden = LEADS.length > 0;
  $("gate").innerHTML = "No leads yet. New intake form answers appear here automatically, or click <b>+ Add lead</b>.";
  $("boardwrap").hidden = false;
  render();
}

function chips(l) {
  const at = idx(l.stage), c = [];
  c.push(`<span class="chip ${l.source === "manual" ? "" : "ok"}">${l.source === "manual" ? "added by you" : "intake ✓"}</span>`);
  if (l.call_at) c.push(`<span class="chip ${at > 1 ? "ok" : "wait"}">${at > 1 ? "call ✓" : "call " + when(l.call_at)}</span>`);
  if (l.quote) c.push(`<span class="chip ${at >= 3 ? "ok" : "wait"}">${at >= 3 ? "quote ✓" : at === 2 ? "quote sent" : "quote draft"}</span>`);
  if (l.stage === "client") c.push(`<span class="chip ok">client</span>`);
  return c.join("");
}
function renderBoard() {
  $("board").innerHTML = STAGES.map(st => {
    const items = LEADS.filter(l => l.stage === st.id);
    return `<div class="col"><div class="colhead"><h3>${st.name}</h3><span class="n">${items.length}</span></div>
      <p class="colhint">${st.hint}</p>
      ${items.map(l => `<button class="card ${l.id === sel ? "sel" : ""}" type="button" data-id="${l.id}">
        <b>${esc(l.name || l.email)}</b><small>${esc(l.business || "")}</small><span class="chips">${chips(l)}</span></button>`).join("")}</div>`;
  }).join("");
}

function renderRecord() {
  const l = lead(); const rec = $("record");
  if (!l) { rec.hidden = true; return; }
  rec.hidden = false;
  const at = idx(l.stage), next = STAGES[at + 1];
  const nextLabel = { call: "Log the 30-min call", quote: "Email quote", agreement: "Quote accepted: send agreement", client: "Agreement signed: make client" }[next?.id];
  rec.innerHTML = `
    <div class="rhead">
      <div><h2>${esc(l.name || "No name")}</h2><p>${esc(l.business || "")} · <span class="mono">${esc(l.email || "")}</span></p></div>
      <div class="row">
        ${next ? `<button class="btn solid" id="advance" type="button">${nextLabel} →</button>` : `<span class="chip ok">client</span>`}
        ${at > 0 ? `<button class="btn" id="back" type="button">← Back a stage</button>` : ""}
        <button class="btn" id="lost" type="button">Mark lost</button>
      </div>
    </div>
    <div id="callPick" hidden class="row"><label class="note" for="callAt">When was or is the call? Nothing is sent to them.</label><input type="datetime-local" id="callAt" style="max-width:240px"><button class="btn solid" id="confirmCall" type="button">Save call</button></div>
    <div class="stepper">${STAGES.map((s, i) => `<span class="step ${i < at ? "done" : i === at ? "now" : ""}">${i < at ? "✓ " : ""}${s.name}</span>`).join("")}</div>
    <div class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" type="button" data-tab="${t.id}" aria-selected="${tab === t.id}">${t.name}${at < t.from ? `<span class="lock">· later</span>` : ""}</button>`).join("")}</div>
    <div class="pane" id="pane">${pane(l, at)}</div>`;
}

function pane(l, at) {
  const locked = t => `<p class="empty">This opens at the <b>${STAGES[TABS.find(x => x.id === t).from].name}</b> stage. Everything from earlier stages carries over.</p>`;
  if (tab === "intake") {
    const rows = [["Name", l.name], ["Email", l.email], ["Business", l.business], ...Object.entries(l.intake || {})];
    return `<p class="src">${l.source === "web" ? "from your intake form" : l.source === "tally" ? "from tally intake form" : "added by you"} · ${when(l.created_at)}</p>
      <div class="kv">${rows.map(([k, v]) => `<div>${esc(k)}</div><div>${esc(v)}</div>`).join("")}</div>
      <button class="btn" id="editIntake" type="button" style="align-self:flex-start">${Object.keys(l.intake || {}).length > 1 ? "Edit answers" : "Fill in intake answers"}</button>`;
  }
  if (tab === "onboard") {
    if (at < 1) return locked("onboard");
    return `<p class="src">call: ${l.call_at ? when(l.call_at) : "no time set"} · intake answers are on the first tab</p>
    <div class="two">
      <div class="pane"><h4 class="mono" style="font-size:13px;color:var(--accent);font-weight:500">call questions</h4>
        <p class="note">★ ask first if time runs short · ${ONBOARD.flatMap(g => g.qs).filter(q => ((l.answers || {})[q.id] || "").trim()).length} of ${ONBOARD.flatMap(g => g.qs).length} answered</p>
        ${ONBOARD.map(g => `<h4 class="grp">${esc(g.h)}</h4>` + g.qs.map(q => `<div class="q"><label for="qa${q.id}">${q.star ? '<span class="star">★</span> ' : ""}${esc(q.q)}</label>${q.note ? `<p class="qnote">${esc(q.note)}</p>` : ""}<textarea id="qa${q.id}" data-q="${q.id}" placeholder="Notes from the call">${esc((l.answers || {})[q.id])}</textarea></div>`).join("")).join("")}
      </div>
      <div class="pane"><h4 class="mono" style="font-size:13px;color:var(--accent);font-weight:500">after the call</h4>
        ${ONBOARD_TASKS.map((t, i) => `<label class="check ${(l.checks || {})[i] ? "donecheck" : ""}"><input type="checkbox" data-c="${i}" ${(l.checks || {})[i] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}
        <a class="btn" href="quote-builder.html?${document.documentElement.classList.contains("embed") ? "embed=1&" : ""}lead=${l.id}" style="align-self:flex-start;text-decoration:none">Build their quote →</a>
      </div>
    </div>`;
  }
  if (tab === "quote") {
    if (at < 1) return locked("quote");
    const q = l.quote || {};
    const qb = "quote-builder.html?" + (document.documentElement.classList.contains("embed") ? "embed=1&" : "") + "lead=" + l.id;
    if (!q.builder && !q.setup) return `<p class="src">no quote yet</p>
      <p class="note">The quote builder opens with ${esc(l.business || l.name || "this lead")} filled in, and saves the quote back to this record as you go.</p>
      <a class="btn solid" href="${qb}" style="align-self:flex-start;text-decoration:none">Build the quote →</a>`;
    const m = qMoney(q);
    const st = [q.sent_at ? "✓ emailed to " + esc(q.sent_to || l.email) + " " + when(q.sent_at) : "not sent yet",
      q.viewed_at ? "✓ opened " + when(q.viewed_at) : q.sent_at ? "not opened yet" : "",
      q.accepted_at ? "✓ accepted by " + esc(q.accepted_by) + " " + when(q.accepted_at) : ""].filter(Boolean).join(" · ");
    return `<p class="src">${esc(q.num || "quote")}${q.saved_at ? " · saved " + when(q.saved_at) : ""}</p>
      <p class="note mono" style="color:${q.accepted_at ? "var(--accent)" : "var(--muted)"}">${st}</p>
      <div class="two">
        <div class="pane">
          ${q.project ? `<div class="line"><span>Project</span><span>${esc(q.project)}</span></div>` : ""}
          <div class="line"><span>Setup</span><span>${money(q.setup)}</span></div>
          ${q.spread ? `<div class="line"><span>Spread over 12 months (${m.fee}% plan fee)</span><span>${money(m.spread)}/mo</span></div>` : `<div class="line"><span>50% deposit</span><span>${money((+q.setup || 0) / 2)}</span></div>`}
          <div class="line"><span>${esc(q.plan || "Plus")} maintenance</span><span>${money(m.maint)}/mo</span></div>
          ${q.tools_monthly ? `<div class="line"><span>Their tools, paid to providers</span><span>about ${money(q.tools_monthly)}/mo</span></div>` : ""}
          <div class="line total"><span>${q.spread ? "Monthly, months 1-12" : "Monthly"}</span><span>${money(q.monthly || m.maint + m.spread)}</span></div>
          ${q.spread && q.monthly_after ? `<div class="line"><span>Monthly from month 13</span><span>${money(q.monthly_after)}</span></div>` : ""}
          ${q.first_year ? `<div class="line"><span>First year, all-in</span><span>${money(q.first_year)}</span></div>` : ""}
        </div>
        <div class="pane" style="gap:10px">
          ${q.accepted_at ? "" : `<a class="btn solid" href="${qb}&send=1" style="align-self:flex-start;text-decoration:none">${q.sent_at ? "Email updated quote →" : "Email quote to " + esc(l.name ? l.name.split(" ")[0] : "client") + " →"}</a>`}
          <a class="btn" href="${qb}" style="align-self:flex-start;text-decoration:none">Open in quote builder</a>
          <p class="note">They get an email with a link to view and accept it online. Accepting moves them to agreement here automatically.</p>
        </div>
      </div>`;
  }
  if (tab === "agreement") {
    if (at < 3) return locked("agreement");
    const q = l.quote || {}, a = l.agreement || {};
    return `<p class="src">service agreement · filled from this record</p>
      <div class="kv">
        <div>Client</div><div>${esc(l.name)}, ${esc(l.business)}</div>
        <div>Quote</div><div>${esc(q.num || "not set")}</div>
        <div>Setup payment</div><div>${q.spread ? "Spread over 12 months, 12-month minimum" : "50% deposit, rest on delivery"}</div>
        <div>Setup</div><div>${money(q.setup)}${q.spread ? ", " + money(qMoney(q).spread) + "/mo for 12 months" : ""}</div>
        <div>Maintenance</div><div>${esc(q.plan || "Plus")} plan, ${money(qMoney(q).maint)}/mo</div>
        <div>Status</div><div>${at >= 4 ? "Signed" + (a.signed_at ? " " + when(a.signed_at) : "") : "Sent for signature"}</div>
      </div>`;
  }
  if (tab === "messages") return `<p class="src">every form, booking and note for this lead, newest first</p>
    ${(EVENTS[l.id] || []).slice().reverse().map(m => `<div class="msg"><span class="meta">${esc(m.who)} · ${when(m.created_at)}</span><p>${esc(m.text)}</p></div>`).join("") || `<p class="note">Nothing logged yet.</p>`}
    <div class="row"><input type="text" id="newmsg" placeholder="Log a note, call or email…" aria-label="New note" style="flex:1;min-width:200px"><button class="btn" id="addmsg" type="button">Add</button></div>`;
  if (tab === "portal") {
    if (at < 4) return locked("portal");
    return `<div class="portal">
      <h4>give them portal access</h4>
      <p>Their record is already linked to <span class="mono">${esc(l.email)}</span>.${(EVENTS[l.id] || []).some(e => /^Portal invite sent/.test(e.text)) ? " Invite already sent. Send again if they lost it." : " One click left."}</p>
      <div class="row">
        <button class="btn solid" id="sendInvite" type="button">Send portal invite</button>
      </div>
      <p class="note">They get an email from Supabase, choose a password or use Google, and land in the portal.</p>
    </div>`;
  }
  return "";
}

function render() { renderBoard(); renderRecord(); }

let saveTimer;
document.addEventListener("click", async e => {
  const card = e.target.closest(".card");
  if (card) { sel = card.dataset.id; tab = "intake"; render(); return; }
  const t = e.target.closest(".tab");
  if (t) { tab = t.dataset.tab; renderRecord(); return; }
  const l = lead();
  const id = e.target.id;
  if (id === "addBtn") { openLeadForm(null); return; }
  if (id === "copyIntake") { const link = new URL("intake.html", location.href).href; try { await navigator.clipboard.writeText(link); toast("Copied " + link + ". Answers land here automatically."); } catch { toast("Your intake form link is " + link); } return; }
  if (id === "editIntake") { openLeadForm(lead()); return; }
  if (id === "cancelAdd") { editing = null; $("addForm").hidden = true; return; }
  if (!l) return;
  if (id === "advance") {
    const next = STAGES[idx(l.stage) + 1];
    if (next.id === "call") { $("callPick").hidden = false; $("callAt").focus(); return; }
    if (next.id === "quote") { location.href = "quote-builder.html?" + (document.documentElement.classList.contains("embed") ? "embed=1&" : "") + "lead=" + l.id + "&send=1"; return; }
    const upd = { stage: next.id };
    if (next.id === "client") upd.agreement = { ...(l.agreement || {}), signed_at: new Date().toISOString() };
    await save(l, upd);
    await logEvent(l, "Ben", { quote: "Quote sent" + (l.quote?.num ? " (" + l.quote.num + ")" : "") + ".", agreement: "Quote accepted. Agreement sent for signature.", client: "Agreement signed. Now a client." }[next.id]);
    tab = { quote: "quote", agreement: "agreement", client: "portal" }[next.id];
    render(); toast("Moved to " + next.name + ".");
  }
  if (id === "confirmCall") {
    const v = $("callAt").value; if (!v) { toast("Pick a date and time first.", true); return; }
    await save(l, { stage: "call", call_at: new Date(v).toISOString() });
    await logEvent(l, "Ben", (new Date(v) < new Date() ? "30-min call held " : "30-min call booked for ") + when(new Date(v)).replace(/\.$/, "") + ". Onboarding started.");
    tab = "onboard"; render(); toast("Moved to 30-min call.");
  }
  if (id === "back") {
    const prev = STAGES[idx(l.stage) - 1]; await save(l, { stage: prev.id });
    await logEvent(l, "Ben", "Moved back to " + prev.name + "."); render();
  }
  if (id === "lost") {
    if (e.target.dataset.armed !== "1") { e.target.dataset.armed = "1"; e.target.textContent = "Click again to confirm"; return; }
    await save(l, { stage: "lost" }); await logEvent(l, "Ben", "Marked as lost.");
    LEADS = LEADS.filter(x => x.id !== l.id); sel = LEADS[0]?.id || null; render(); toast("Marked as lost. It's kept in Supabase for your records.");
  }
  if (id === "addmsg") {
    const v = $("newmsg").value.trim(); if (!v) return;
    await logEvent(l, "Ben", v); renderRecord();
  }
  if (id === "sendInvite") {
    const b = e.target; b.disabled = true; b.textContent = "Sending…";
    const { data, error } = await sb.functions.invoke("invite-client", { body: { lead_id: l.id, redirect_to: new URL("portal.html", location.href).href } });
    let msg = data?.error;
    if (error && !msg) { try { msg = (await error.context.json()).error; } catch { msg = /Failed to send|fetch/i.test(error.message) ? "The invite function isn't set up yet in Supabase." : error.message; } }
    if (msg) { b.disabled = false; b.textContent = "Send portal invite"; toast(msg, true); return; }
    (EVENTS[l.id] ||= []).push({ who: "Ben", text: "Portal invite sent to " + data.email + ".", created_at: new Date().toISOString() });
    renderRecord(); toast("Invite sent to " + data.email + ".");
  }
});
document.addEventListener("input", e => {
  const l = lead(); if (!l) return;
  const d = e.target.dataset;
  if (d.q !== undefined) { l.answers = { ...(l.answers || {}), [d.q]: e.target.value }; clearTimeout(saveTimer); saveTimer = setTimeout(() => save(l, { answers: l.answers }), 600); }
  if (d.c !== undefined) { l.checks = { ...(l.checks || {}), [d.c]: e.target.checked }; e.target.closest(".check").classList.toggle("donecheck", e.target.checked); save(l, { checks: l.checks }); }
  if (d.qf !== undefined) {
    const q = { ...(l.quote || { plan: "Plus" }) };
    q[d.qf] = e.target.type === "checkbox" ? e.target.checked : d.qf === "setup" ? parseFloat(e.target.value.replace(/[^0-9.]/g, "")) || 0 : e.target.value;
    l.quote = q; clearTimeout(saveTimer); saveTimer = setTimeout(async () => { await save(l, { quote: q }); if (tab === "quote") { const f = document.activeElement?.id; renderRecord(); if (f && $(f)) $(f).focus(); } }, 700);
  }
});
document.addEventListener("change", e => { if (e.target.dataset.qf === "plan") e.target.dispatchEvent(new Event("input", { bubbles: true })); });
$("nStage").addEventListener("change", () => { $("nCallWrap").hidden = $("nStage").value !== "call"; });
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const base = { name: $("nName").value.trim(), email: $("nEmail").value.trim().toLowerCase(), business: $("nBiz").value.trim() };
  if (editing) {
    const l = editing, intake = readIntake(l.intake || {});
    await save(l, { ...base, intake }); await logEvent(l, "Ben", "Intake answers updated.");
    editing = null; $("addForm").hidden = true; tab = "intake"; render(); toast("Saved."); return;
  }
  const row = { ...base, source: "manual", intake: readIntake({}) };
  const had = $("nStage").value === "call";
  if (had) { row.stage = "call"; row.call_at = new Date(($("nCall").value || new Date().toLocaleDateString("en-CA")) + "T12:00").toISOString(); }
  const { data, error } = await sb.from("leads").insert(row).select().single();
  if (error) { toast("Couldn't add: " + error.message, true); return; }
  LEADS.unshift(data); sel = data.id; tab = had ? "onboard" : "intake";
  await logEvent(data, "Ben", had ? "Lead added by hand. 30-min call already held " + new Date(row.call_at).toLocaleDateString("en-CA", { month: "short", day: "numeric" }) + "." : "Lead added by hand.");
  $("addForm").reset(); $("addForm").hidden = true; $("gate").hidden = true; render();
});

(async () => {
  const { data } = await sb.auth.getSession();
  const s = data.session;
  if (!s) { $("gate").innerHTML = 'Sign in first on the <a href="portal.html" target="_top">client portal</a>, then come back to this page.'; return; }
  const { data: ok } = await sb.rpc("is_admin");
  if (!ok) { $("gate").textContent = "This page is for BS2 only."; return; }
  $("who").textContent = s.user.email; $("addBtn").hidden = false; $("copyIntake").hidden = false;
  load();
})();
</script>
</body>
</html>
